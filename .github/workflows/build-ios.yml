name: Build iOS (서명 전 IPA)

on:
  push:
    branches: [main]
    paths-ignore: ['NOTES.md', 'README.md', 'CLAUDE.md', 'docs/**', 'tests/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: 도구 정보
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          ls /Applications | grep -i xcode || true

      # 교회 계정(v75): 저장소 Settings › Secrets 의 서버 주소·공개(anon) 키로 앱의 www/sb.json(저장소에는 빈 값)을 덮어쓴다.
      # 공개 키는 원래 앱 안에 들어가는 키이며, 데이터는 서버의 행 단위 접근 규칙이 지킨다. service_role 키는 절대 쓰지 않는다.
      - name: 교회 서버 주소·공개 키 넣기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            python3 - <<'PY'
          import json, os, re, sys
          from urllib.parse import urlsplit
          # 값은 로그에 찍지 않고(비밀), 무엇을 고쳤는지만 알린다.
          def clean(v, name):
              q = lambda x: x.strip().strip('"').strip("'").strip()
              v1 = q(v)
              if v1.upper().startswith(name + '='):
                  v1 = q(v1[len(name) + 1:])
                  print(name + ': 앞의 "' + name + '=" 를 뗌')
              elif v1 != v.strip():
                  print(name + ': 앞뒤 따옴표를 뗌')
              return v1
          raw = clean(os.environ['SUPABASE_URL'], 'SUPABASE_URL')
          key = clean(os.environ['SUPABASE_ANON_KEY'], 'SUPABASE_ANON_KEY')
          if '://' not in raw:
              raw = 'https://' + raw
              print('SUPABASE_URL: 앞에 https:// 를 붙임')
          p = urlsplit(raw)
          if p.path not in ('', '/') or p.query:
              print('SUPABASE_URL: 주소 뒤의 경로(예: /rest/v1/)를 뗌')
          host = (p.hostname or '').lower()
          if p.scheme.lower() != 'https':
              sys.exit('SUPABASE_URL 이 https 주소가 아닙니다. Project Settings › API 의 Project URL(https://….supabase.co)을 넣어 주세요')
          if not re.match(r'^[a-z0-9-]+(\.[a-z0-9-]+)+$', host):
              sys.exit('SUPABASE_URL 에서 서버 주소를 찾지 못했습니다(글자 수 ' + str(len(raw)) + '). Project URL(https://….supabase.co)을 다시 넣어 주세요')
          if not host.endswith('.supabase.co'):
              print('알림: 서버 주소가 .supabase.co 로 끝나지 않습니다(직접 도메인을 쓰는 경우가 아니면 Project URL 을 확인)')
          url = 'https://' + host + (':' + str(p.port) if p.port else '')
          if not re.match(r'^[A-Za-z0-9._-]+$', key):
              sys.exit('SUPABASE_ANON_KEY 에 키에 쓰지 않는 글자(공백·줄바꿈 등)가 섞여 있습니다. 공개 키만 다시 복사해 넣어 주세요')
          role = ''
          if key.count('.') == 2:   # 예전 방식(JWT) 키: 가운데 조각을 풀어 역할(role)을 본다
              import base64
              try:
                  mid = key.split('.')[1]
                  role = json.loads(base64.urlsafe_b64decode(mid + '=' * (-len(mid) % 4))).get('role', '')
              except Exception:
                  role = ''
          if role == 'service_role' or key.startswith('sb_secret_'):
              sys.exit('SUPABASE_ANON_KEY 에 비밀(service_role/secret) 키가 들어 있습니다. 공개(anon/publishable) 키로 바꿔 주세요')
          json.dump({'url': url, 'key': key}, open('www/sb.json', 'w'))
          print('www/sb.json 만듦:', url.split('//')[1].split('.')[0][:4] + '…')
          PY
          else
            echo "Secrets(SUPABASE_URL·SUPABASE_ANON_KEY)가 없어 교회 기능은 '서버 설정 안 됨'으로 표시됩니다"
          fi

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: Xcode 프로젝트 만들기
        run: xcodegen generate

      - name: 빌드 (서명 없이)
        run: |
          set -o pipefail
          xcodebuild \
            -project BibleFlip.xcodeproj \
            -scheme BibleFlip \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee build.log

      - name: IPA 만들기
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name 'BibleFlip.app' | head -1)
          echo "앱 위치: $APP"
          rm -rf Payload BibleFlip.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry BibleFlip.ipa Payload
          ls -la BibleFlip.ipa
          plutil -p "$APP/Info.plist" | head -40

      - name: 보관 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: BibleFlip-ipa
          path: BibleFlip.ipa

      - name: 내려받기용 Release 만들기
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BibleFlip.ipa \
            --prerelease \
            --title "최신 빌드 (서명 전) #${{ github.run_number }}" \
            --notes "Windows PC의 Sideloadly로 서명해 설치하는 서명 전 IPA입니다. 커밋 ${GITHUB_SHA::7}"

      - name: 빌드 기록을 build-logs 브랜치에 남기기
        if: always()
        run: |
          mkdir -p /tmp/logs
          { echo "run: $GITHUB_RUN_ID #${{ github.run_number }}  sha: $GITHUB_SHA"; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; } > /tmp/logs/info.txt 2>&1 || true
          [ -f build.log ] && tail -n 4000 build.log > /tmp/logs/build.log || echo "build.log 없음" > /tmp/logs/build.log
          cd /tmp/logs
          git init -q
          git checkout -q -b build-logs
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build log #${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-logs
