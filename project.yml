name: BibleFlip
options:
  bundleIdPrefix: com.choice0829
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  BibleFlip:
    type: application
    platform: iOS
    sources:
      - path: BibleFlip
      - path: www
        type: folder
        buildPhase: resources
    info:
      path: BibleFlip/Info.plist
      properties:
        CFBundleDisplayName: 선한성경
        CFBundleName: 선한성경
        CFBundleDevelopmentRegion: ko
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # 바이블 포토 카드: 사진 고르기(사진 보관함·카메라)와 완성한 카드를 사진 앱에 저장할 때 iOS가 보여 주는 안내 문구
        NSCameraUsageDescription: 바이블 포토 카드에 넣을 사진을 찍기 위해 카메라를 사용합니다.
        NSPhotoLibraryUsageDescription: 바이블 포토 카드에 넣을 사진을 고르기 위해 사진 보관함을 사용합니다.
        NSPhotoLibraryAddUsageDescription: 완성한 바이블 포토 카드를 사진 앱에 저장합니다.
        # 모임 장소 지도: 내 위치 기준으로 가까운 순서를 보여 줄 때 iOS가 보여 주는 안내 문구 (앱을 쓰는 동안에만 사용)
        NSLocationWhenInUseUsageDescription: 모임 장소 지도에서 내 위치와 등록한 카페까지의 거리를 보여 주기 위해 현재 위치를 사용합니다.
        # 네이버 지도 앱이 설치되어 있는지 확인할 수 있도록 허용하는 주소
        LSApplicationQueriesSchemes:
          - nmap
        LSRequiresIPhoneOS: true
        # 이 항목이 있어야 iOS가 앱을 '모든 화면 크기를 지원하는 앱'으로 보고 letterbox 없이 화면 전체로 연다.
        UILaunchScreen:
          UIColorName: LaunchBG
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.choice0829.bibleflip
        PRODUCT_NAME: BibleFlip
        MARKETING_VERSION: "76"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
